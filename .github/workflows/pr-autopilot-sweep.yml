# Scheduled and manual sweeps. Copy to .github/workflows/ in the governed repository.
name: pr-autopilot sweep

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show verdicts without acting
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-autopilot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-slim
    steps:
      - uses: Zebradil/pr-autopilot@4bcc29c03641a86a6bee67f9cb8c999d7ca4df5d # v1.4.0
        with:
          dry-run: ${{ inputs.dry_run }}
          # Set the PR_AUTOPILOT_CLIENT_ID variable to act as a GitHub App (the documented identity), or leave it
          # unset to fall back to the PR_AUTOPILOT_TOKEN secret. See docs/manual.md, "Identity".
          client-id: ${{ vars.PR_AUTOPILOT_CLIENT_ID }}
          app-private-key: ${{ secrets.PR_AUTOPILOT_APP_PRIVATE_KEY }}
          token: ${{ secrets.PR_AUTOPILOT_TOKEN }}
