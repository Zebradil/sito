name: CI

# Every run that can read the cache secrets publishes: main and same-repo pull
# requests alike, so a pull request's build is a cache hit on main after the
# merge. Fork pull requests get no secrets and build without publishing.
# nix-ci's build action follows each push with the kasha manifest that keeps
# it alive through kasha's GC.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zebradil/nix-ci/.github/actions/setup-nix@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          # Binary cache, read side. Plain public HTTPS reads, so this works
          # for fork pull requests too — `vars` are exposed to them, unlike
          # `secrets`.
          extra-substituters: ${{ vars.NIX_CACHE_URL }}
          extra-trusted-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEY }}

      # cargo fmt/clippy live as checks.<system>.{fmt,clippy} and cargo test
      # runs in the package's checkPhase (checks.<system>.build), so the build
      # job below covers all three; --no-build here only proves the flake
      # still evaluates, on a system the build matrix might not cover.
      - run: nix flake check --no-build

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zebradil/nix-ci/.github/actions/setup-nix@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          extra-substituters: ${{ vars.NIX_CACHE_URL }}
          extra-trusted-public-keys: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
          signing-key: ${{ secrets.CACHE_SIGNING_KEY }}

      - uses: zebradil/nix-ci/.github/actions/build@9c24e195d57be4639a5c85007c0c73eb805604cc # v2.0.1
        with:
          attr: checks.${{ matrix.system }}
          # Empty without the AWS secrets, so a fork pull request builds without
          # attempting a push it has no credentials for.
          cache-s3-url: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.CACHE_S3_URL || '' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # The retention group sito's main generations are filed under. A new
          # name would strand that group's newest generations: retention always
          # keeps a group's newest, and nothing would ever supersede them.
          kasha-attr: checks-${{ matrix.system }}
