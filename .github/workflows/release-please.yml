name: Release

# release-please maintains a release PR from Conventional Commits; merging it bumps the version in
# Cargo.toml and Cargo.lock (and so the version flake.nix reads from it), updates CHANGELOG.md and
# tags vX.Y.Z.
#
# The token comes from octo-sts (policy `release-please` in Zebradil/.github), not GITHUB_TOKEN:
# a GITHUB_TOKEN-created PR fires no `pull_request` events, so CI would never run on the release
# PR. The policy admits only `.github/workflows/release-please.yml` on main, so this file's name
# is load-bearing.

on:
  push:
    branches: [main]
  # release-please only compares an open release PR's title and body, so it will not pick up a
  # config change on its own. Closing the PR and dispatching this rebuilds it.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-slim
    steps:
      - name: Exchange OIDC token for GitHub token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sts
        with:
          domain: sts.zebradil.dev
          scope: ${{ github.repository_owner }}
          identity: release-please

      - name: Update release PR or tag release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.sts.outputs.token }}
