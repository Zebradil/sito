# yaml-language-server: $schema=node_modules/@zebradil/starlight-kit/schema/site.schema.json
name: sito
tagline: A local always-on Nix substituter proxy for roaming clients.
repo: https://github.com/Zebradil/sito
theme: sieve
logo: { light: ./src/assets/logo.svg, dark: ./src/assets/logo-dark.svg }
headline: One substituter. The fastest reachable cache.
eyebrow: Nix substituter proxy # guessed: category label condensed from the README title line
description: >- # guessed: README opening paragraph, shortened to fit the 400-char limit
  Nix is configured with a single substituter, `http://localhost:5001`, and sito
  routes every narinfo/NAR request to the best reachable upstream binary cache:
  no substituter-list editing and no connect-timeout tax.
install:
  - label: Nix
    code: nix profile install github:Zebradil/sito # guessed: flake has packages.default; README documents the flake input only, command not run
  - label: Cargo
    code: cargo install --git https://github.com/Zebradil/sito # guessed: crate not on crates.io; command not run
features:
  - title: One substituter, many caches # guessed: condensed from README intro
    body: Nix talks to one localhost endpoint; sito streams each narinfo/NAR request from the best reachable upstream, with no cache of its own.
  - title: Ordered tiers # guessed: condensed from README "Shape"
    body: Upstreams are grouped in ordered tiers, each with a selection strategy; the first tier that produces a hit wins.
  - title: Ranking from real traffic # guessed: condensed from README "Shape" and src/probe.rs
    body: Upstreams are ranked from passive traffic metrics plus timed `/nix-cache-info` reachability probes.
  - title: Trust stays in Nix # guessed: condensed from README "Shape"
    body: Narinfos pass through unmodified and sito holds no keys; the Nix client verifies signatures as before.
  - title: Inspectable ranking # guessed: condensed from README "Shape"
    body: A `/status` JSON endpoint exposes what the ranker sees for every upstream, and `/metrics` keeps it graphable over time, even from a roaming laptop.
  - title: NixOS and nix-darwin modules # guessed: condensed from README module section
    body: Modules run the daemon and point `nix.settings.substituters` at sito, trusting every upstream's public keys.
cascade:
  request: nix → GET /<hash>.narinfo → 127.0.0.1:5001
  hub: { name: sito, body: Builds a selection plan from probe results and measured traffic. }
  tiers:
    - name: lan
      label: tier 1 · sequential
      backends:
        - { id: box, name: "http://box.lan:5000" }
        - { id: remote, name: "https://znix.zebradil.dev" }
    - name: public
      label: tier 2 · sequential
      backends:
        - { id: nixos, name: "https://cache.nixos.org" }
  scenarios:
    - label: Away
      note: The box failed its last `GET /nix-cache-info` probe, so the plan never dials it and no connect timeout is paid. Back home, the next probe brings it back.
      states:
        box: { state: down, text: last probe timed out }
        remote: { state: hit, text: narinfo relayed unmodified }
        nixos: { state: idle, text: tier 1 hit }
    - label: At home
      note: On the LAN the box answers fastest, so it ranks first in its tier and the request never leaves the house.
      states:
        box: { state: hit, text: ranked first by latency }
        remote: { state: idle, text: tier already hit }
        nixos: { state: idle, text: tier 1 hit }
    - label: Only upstream
      note: Neither private cache has the path, so tier 1 misses and the request falls through to the public tier.
      states:
        box: { state: miss, text: "404" }
        remote: { state: miss, text: "404" }
        nixos: { state: hit, text: first hit in tier 2 }
components:
  items:
    - name: sito
      body: The proxy daemon, configured from a TOML file.
    - name: nixosModules.default
      body: Runs sito as a NixOS service (`services.sito`).
    - name: darwinModules.default
      body: Runs sito as a nix-darwin service (`services.sito`).
links:
  - label: Changelog
    href: https://github.com/Zebradil/sito/blob/main/CHANGELOG.md
reference:
  cli:
    bin: sito
    build: cargo build --release
    path: target/release/sito
